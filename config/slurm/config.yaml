# Snakemake 8 profile: SLURM through the cluster-generic executor.
# (The SLURM executor plugin needs sacct, which this cluster does not provide.)
executor: cluster-generic
cluster-generic-submit-cmd: >-
  sbatch --parsable
  -A {resources.slurm_account} -p {resources.slurm_partition} --qos {resources.slurm_account}
  --nodelist={resources.slurm_nodelist}
  --cpus-per-task={threads} --mem={resources.mem_mb} --time={resources.runtime}
  -J {rule} -o logs/slurm/{rule}_%j.log
cluster-generic-status-cmd: status.sh   # resolved relative to this profile folder
cluster-generic-cancel-cmd: scancel
max-status-checks-per-second: 2
jobs: 100
latency-wait: 60

software-deployment-method: conda
conda-frontend: conda

default-resources:
  slurm_account: "adelab"
  slurm_partition: "genomics"
  slurm_nodelist: "cn20"   # every job runs on this node
  mem_mb: 8000
  runtime: 720   # minutes

printshellcmds: True
keep-going: True
rerun-incomplete: True
rerun-triggers: "mtime"
